name: tmp-upgrades-ci
on:
  push:
    branches: [ci/happy-dom]
permissions:
  contents: read
jobs:
  build-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm audit
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run src/pages/admin/__tests__
      - run: npx vite build
